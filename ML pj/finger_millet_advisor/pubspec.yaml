name: finger_millet_advisor
description: Offline disease-detection and advisory app for finger millet and related crops.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Camera
  camera: ^0.11.0+2

  # TensorFlow Lite inference
  tflite_flutter: ^0.11.0

  # SQLite local storage
  sqflite: ^2.3.3+2

  # Text-to-Speech
  flutter_tts: ^4.2.0

  # File system paths
  path_provider: ^2.1.4
  path: ^1.9.0

  # Image processing (for Grad-CAM overlay)
  image: ^4.3.0

  # UI helpers
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/advisory_db/
